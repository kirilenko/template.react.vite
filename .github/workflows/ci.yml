name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - stage
      - dev

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Set build mode
        id: mode
        run: |
          case "${{ github.ref_name }}" in
            main) echo "mode=production" >> $GITHUB_OUTPUT ;;
            stage) echo "mode=stage" >> $GITHUB_OUTPUT ;;
            *) echo "mode=dev" >> $GITHUB_OUTPUT ;;
          esac

      # To inject secrets, add a step before Build:
      # - run: echo "VITE_API_KEY=${{ secrets.API_KEY }}" >> .env

      - name: Build
        run: pnpm build --mode ${{ steps.mode.outputs.mode }}
